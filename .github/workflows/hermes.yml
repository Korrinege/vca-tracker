name: Hermes UK Lindy check

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only test Bark and email; do not check stock"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hermes-uk-lindy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check Hermes stock
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python hermes_monitor.py --test-email
          else
            python hermes_monitor.py
          fi
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-screenshot
          path: hermes_last_check.png
          retention-days: 3
          if-no-files-found: ignore
