name: VCA restock check

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "只发测试邮件和手机警报，不检查库存"
        type: boolean
        default: false

jobs:
  check:
    name: Check ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        region: [gb, hk]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check stock
        env:
          VCA_REGION: ${{ matrix.region }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python vca_monitor.py --test-email
          else
            python vca_monitor.py --once
          fi

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-screenshot-${{ matrix.region }}
          path: vca_last_unknown.png
          retention-days: 3
          if-no-files-found: ignore
