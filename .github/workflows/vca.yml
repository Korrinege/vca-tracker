name: VCA restock check

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "只发测试邮件和手机警报，不检查库存"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # Browsers and Linux dependencies are already included.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --init --ipc=host

    strategy:
      fail-fast: false
      matrix:
        region: [gb, hk]

    steps:
      - uses: actions/checkout@v5

      # The Python package must match the container's browser version.
      - name: Install matching Playwright package
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 playwright==1.64.1

      - name: Verify Chromium can launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              print("Chromium ready:", browser.version)
              browser.close()
          PY

      - name: Check stock
        env:
          VCA_REGION: ${{ matrix.region }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python vca_monitor.py --test-email
          else
            python vca_monitor.py --once
          fi

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unknown-screenshot-${{ matrix.region }}
          path: vca_last_unknown.png
          retention-days: 3
          if-no-files-found: ignore
